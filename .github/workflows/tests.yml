name: brew test-bot

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-bot:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Detect private enterprise formula-only PR
        id: formula-scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          files="$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" |
              brew ruby -rjson -e 'JSON.parse(STDIN.read).each { |file| puts file.fetch("filename") }'
          )"
          formula_files="$(printf '%s\n' "$files" | grep -E '^Formula/.*\.rb$' || true)"
          if [ "$formula_files" = "Formula/helm-ai-enterprise.rb" ]; then
            echo "private_enterprise_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "private_enterprise_only=false" >> "$GITHUB_OUTPUT"
          fi

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request' && steps.formula-scope.outputs.private_enterprise_only != 'true'

      - name: Skip private enterprise formula install
        if: github.event_name == 'pull_request' && steps.formula-scope.outputs.private_enterprise_only == 'true'
        run: |
          echo "::notice::Skipping brew install for the HEAD-only private helm-ai-enterprise formula; tap syntax already ran."

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
