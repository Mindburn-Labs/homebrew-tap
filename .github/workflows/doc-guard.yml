name: Doc Guard

# Calls the reusable doc-fingerprint guard in platform-actions (anti-regrowth, 2026-06-29).
# Pinned to the platform-actions commit SHA so it resolves before that branch merges to
# platform-actions main. After the guard lands on platform-actions main, bump @abe7bfc2c4b949722e194e43820ed03079bd1913
# to a release tag or @main.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doc-guard:
    uses: Mindburn-Labs/platform-actions/.github/workflows/doc-fingerprint-guard.yml@abe7bfc2c4b949722e194e43820ed03079bd1913
