name: Doc Guard

# Anti-regrowth gate for the 2026-06-29 markdown estate cleanup: fails if any
# tracked Markdown reintroduces the fabricated-README template fingerprints or
# the corrupted app-mindburn-web.org domain.
#
# This repo runs the scan inline rather than calling the shared reusable workflow
# at Mindburn-Labs/platform-actions/.github/workflows/doc-fingerprint-guard.yml.
# homebrew-tap is a PUBLIC repo and platform-actions is INTERNAL; GitHub does not
# let a public caller resolve a reusable workflow in a private or internal repo,
# so every call failed at workflow-parse time with "workflow was not found" and
# the guard never actually executed. Keep the pattern set below byte-identical to
# the reusable workflow — that file remains the source of truth for every
# internal/private caller, and any change there must be mirrored here.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doc-guard:
    timeout-minutes: 20
    name: Reject fabricated-template / corrupted-doc fingerprints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan Markdown for banned fingerprints
        shell: bash
        run: |
          set -euo pipefail
          # High-specificity strings unique to the fabricated-template / domain corruption.
          # These never appear in legitimate Mindburn docs; a hit means regrowth.
          patterns='app-mindburn-web\.org|svc-titan-proofd|Rollback Class R[0-9]|sovereign microservice|HELM Notary'
          hits="$(grep -rnE "$patterns" --include='*.md' . \
            | grep -v -e '/node_modules/' -e '/.git/' -e '/vendor/' -e '/.codex-security-scan/' || true)"
          if [ -n "$hits" ]; then
            echo "::error::Banned doc fingerprint(s) found — fabricated-template or corrupted-domain regrowth. Fix before merge:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no banned doc fingerprints."
